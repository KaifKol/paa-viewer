[package]
name = "paa-viewer"
version = "0.1.1"
edition = "2024"
[lib]
name = "paa_viewer"
crate-type = ["rlib"]


[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "webp"] }
texpresso = "2.0.2"
byteorder = "1.5"
indexmap = "2.7"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
