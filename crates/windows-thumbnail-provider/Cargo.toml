[package]
name = "paa_thumbnail_provider"
version = "0.1.2"
edition = "2024"

[lib]
name = "paa_thumbnail_provider"
crate-type = ["cdylib"]

[dependencies]
image = { version = "0.25", default-features = false }
paa_viewer = { package = "paa-viewer", path = "../.." }
windows-core = "0.58.0"
windows = { version = "0.58.0", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

[workspace]
